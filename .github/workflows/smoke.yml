# Proof that the container this repository ships builds, boots and serves traffic: on every pull
# request to `main`, every week, and by hand.
#
# This used to stay off the merge path, for two reasons. Neither holds.
#
# "Building an image and starting a stack is too expensive to run on every pull request." Measured on
# this repository's hosted runners, on the run that proved 0.30.1: each of the two jobs below took
# 19 s, and the test suite in ci.yml, which already gates every merge, took 93 s. They run in parallel
# with it, so they add close to nothing to a pull request's wait, and standard hosted runners cost
# nothing on a public repository.
#
# "A weekly signal is enough to identify which recent merge broke it." That is an argument about
# finding the culprit, not about stopping it. tag.yml tags a merge that carries a new version, so that
# merge is a release the moment it lands. 0.30.0 shipped an image that did not build, and the weekly
# run would have said so four days later, about a tag that was already published.
#
# The schedule stays, and it runs whether or not anything has landed. The Dockerfile names its base
# images by tag, not by digest, so the build can break on a `main` nobody has touched, and a run on an
# unchanged `main` is exactly the run that catches it.
#
# The shell lives in scripts/smoke.sh rather than in this file, so a contributor can run exactly
# what this workflow runs against their own clone.
#
# It runs twice, against bind mounts owned two different ways. The second run is the only thing in
# this repository that exercises the case a hosted runner's own user id conceals; see the comment on
# that job for why one run was never enough.

name: Smoke

on:
  # No `paths` filter, on purpose. A filter that forgot one of the image's inputs would let a change
  # to it through unbuilt, and a workflow a filter skips leaves its required checks pending, so the
  # pull request waits on them forever.
  #
  # `pull_request`, never `pull_request_target`. A pull request from a fork runs its own code here, and
  # `pull_request` gives that code a read-only token and no secrets, which is all the smoke needs.
  # `pull_request_target` would hand it a token that can write to this repository.
  pull_request:
    branches: [main]
  schedule:
    # Mondays, off the hour on purpose: scheduled runs at minute zero are heavily contended on
    # the platform and get delayed, sometimes substantially.
    - cron: "17 6 * * 1"
  # For a run neither trigger above would start: `main` between Mondays, when one of the base
  # images the Dockerfile names has moved, or a branch that is not yet a pull request.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the run on the older one, and that run is cancelled, as in
# ci.yml. A scheduled or dispatched run is left to finish, because its result is the reason it was
# started, and a cancelled run has none.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both jobs are meant to be required checks on `main`, under these names. Branch protection requires a
# check by name, and a renamed job never reports under the old one, so every pull request would wait
# on it forever.
#
# Neither job carries a condition or waits on another. A job skipped by a condition reports success,
# even as a required check, so a pull request would merge on a green smoke that never built anything.
jobs:
  smoke:
    name: Container smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # One step, on purpose. Dumping logs on failure and tearing the stack down live in the
      # script's own exit trap, so a contributor running it locally gets exactly this behaviour.
      - run: ./scripts/smoke.sh

  smoke-foreign-uid:
    name: Container smoke, bind mounts owned by another uid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The case the job above is structurally unable to see, and the reason this one is permanent.
      #
      # A hosted runner's own user carries uid 1001 — the same id as the account inside the image —
      # so a bind mount the runner creates is already owned by exactly the right user. The job above
      # therefore passes for a reason that has nothing to do with the code, and would keep passing
      # if the container lost the ability to write into a directory it did not create. Handing the
      # two directories to a different uid first is what reproduces the case an ordinary Linux
      # contributor meets: the quickstart's `mkdir -p` leaves them owned by whoever ran it.
      #
      # 1000 is the first ordinary user id on a Debian or Ubuntu desktop, so it stands in for
      # precisely that contributor. Creating the directories here rather than letting the script do
      # it is load-bearing — the script creates them itself when they are absent, and one it creates
      # belongs to the runner again.
      #
      # Both ownership cases are kept because they fail for different reasons. Deleting either loses
      # a signal, and deleting this one returns this workflow to passing by coincidence.
      - name: Hand the bind-mount sources to a uid that is not the runner's
        run: |
          set -euo pipefail
          mkdir -p data data.keys
          sudo chown 1000:1000 data data.keys
          printf 'runner uid: %s (the container runs as uid 1001)\n' "$(id -u)"
          ls -ld data data.keys

      - run: ./scripts/smoke.sh
