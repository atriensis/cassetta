# Cassetta — self-host stack.
#
#   cp .env.example .env      # then set CASSETTA_SETUP_TOKEN
#   docker compose up -d
#   curl http://localhost:16001/health
#
# Configuration is read from `.env`. Compose loads that same file for `${CASSETTA_PORT}`
# interpolation below, so the host port is set in one place.

services:
  cassetta:
    build:
      context: .
    image: cassetta:local
    container_name: cassetta
    restart: unless-stopped
    env_file: .env
    ports:
      # Host port is configurable; the in-container port is fixed at 16001.
      # To bind loopback only, replace with "127.0.0.1:${CASSETTA_PORT:-16001}:16001".
      - "${CASSETTA_PORT:-16001}:16001"
    volumes:
      # Stored files. Back this up.
      - ./data:/data
      # API key store — deliberately outside the storage tree so key files never appear
      # in a `/files/` listing or get served as user data. Back this up too.
      - ./data.keys:/data.keys
    # No health probe is declared here, on purpose. The image declares one — the HEALTHCHECK
    # instruction in the Dockerfile — with the same command and the same intervals, and that is the
    # probe this deployment gets.
    #
    # It is deliberately not repeated here, because a probe declared on a container *replaces* the
    # image's rather than merging with it. A copy in this file would therefore win silently, and it
    # would not carry the privilege drop the image's probe has: the probe runs outside the
    # entrypoint, so its own command is the only place that drop can live. Adding one here would
    # quietly put a root process back into every thirty-second interval for the life of the
    # container, without changing a line of the Dockerfile.
    #
    # To change the probe or its timings, edit the Dockerfile.
