[project]
name = "cassetta"
dynamic = ["version"]
description = "A lightweight file exchange bus for distributed AI agents"
# The README is the description, so its links are written absolutely: on the index a relative link
# resolves against the index's own URL. `tests/test_public_surface.py` holds both halves of that.
readme = "README.md"
# The address is shown on the index page and returned by its public JSON API, which mirrors copy, so
# it is the most harvested address this project publishes. It exists for this field alone. The
# addresses that receive vulnerability reports and signed CLAs are where a missed message costs
# something, and `tests/test_release_metadata.py` keeps them out of this line.
authors = [{ name = "Evgeny Zhoga", email = "pypi@atriensis.ai" }]
requires-python = ">=3.13"
# An SPDX expression, and the only statement of the licence: no classifier exists for it, so the list
# below carries none. `tests/test_release_metadata.py` says why a `License ::` line would be worse.
license = "FSL-1.1-ALv2"
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
    "Typing :: Typed",
]
# The client, and only the client. This is what an install without an extra gets: the three
# libraries `src/cassetta/cli/` imports beyond the standard library and `cassetta.path_validation`.
# A fourth entry here would mean the finding behind the split was wrong — it is a question to raise,
# not a line to add. `tests/test_client_install.py` holds the other side of the same statement.
dependencies = [
    "httpx>=0.27",
    "pyjwt>=2.10",
    "typer>=0.21",
]

[project.optional-dependencies]
# The server, asked for by name: `cassetta[server]`. An install that must run
# `uvicorn --factory cassetta.app:create_app` needs these and the base three; an install that only
# wants the CLI needs none of them, which is the point.
#
# `mcp` is capped because 2.x renamed `FastMCP` to `MCPServer` and moved it: `src/cassetta/mcp_server.py`
# imports `mcp.server.fastmcp`, which does not exist there. Until 0.28.1 this list said `mcp>=1.12`
# with no upper bound, so `pip install "cassetta[server]"` resolved a server that could not start —
# invisible to every gate here, because `uv.lock` pins 1.27.0, and visible to everyone installing
# from an index. `<2` is the bound the SDK's own error message names. It is the only cap in this
# list: every other dependency was measured at its newest release and passes.
#
# `anyio`, `limits`, `pydantic` and `starlette` are declared rather than inherited, for the reason
# the `pyyaml` line below gives. All four are imported by name under `src/` and used to arrive only
# as transitives of `fastapi`, `slowapi` and `httpx` — so a change in somebody else's dependency
# graph would have broken this package for a reason with nothing to do with it. `pydantic` is the
# sharpest: `models.py` imports `field_validator`, which is v2-only, while `fastapi>=0.115` still
# admits v1. Floors are the lowest version this code is known to work with, not the pinned one:
# declaring these adds resolution edges and moves no version.
# `tests/test_declared_dependencies.py` holds the general rule.
server = [
    "anyio>=4.0",
    "fastapi>=0.115",
    "limits>=2.3",
    "mcp>=1.12,<2",
    "pydantic>=2.0",
    "slowapi>=0.1.9",
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "ruff>=0.8",
    "mypy>=1.13",
    # Declared rather than inherited. It is reachable today only as a transitive of
    # `uvicorn[standard]`, so the workflow guard that imports it would otherwise depend on somebody
    # else's dependency graph — and go red for a reason with nothing to do with this repository the
    # day that graph changes. The constraint block already pins the version; this only makes the
    # dependency ours.
    "pyyaml>=6.0",
    # Same decision, taken for the same reason by `tests/test_declared_dependencies.py`, which parses
    # requirement strings and canonicalises distribution names rather than comparing them as text.
    # Reachable today only as a transitive of `pytest`.
    "packaging>=24.0",
    # The development environment is a server environment. Every gate in this repository is a bare
    # `uv run` line and CI runs `uv sync --extra dev` before them — and `uv sync` is exact, so it
    # uninstalls whatever the requested sets do not ask for. Without this self-reference the test
    # suite, which imports FastAPI throughout, would need `--extra server` on every command, and
    # every gate already written would quietly start meaning something else.
    "cassetta[server]",
]

[project.scripts]
cassetta = "cassetta.cli:app"

[project.urls]
Homepage = "https://github.com/atriensis/cassetta"
Repository = "https://github.com/atriensis/cassetta"
Issues = "https://github.com/atriensis/cassetta/issues"
Changelog = "https://github.com/atriensis/cassetta/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version is declared once, in the package itself, and read from there at build time. Stating it
# here as well is what let the two drift: nothing forced them to move together except a habit.
#
# The default version source reads the literal out of the file as *text*. That is load-bearing, not a
# default accepted by omission. It used to be load-bearing for a second reason as well —
# `src/cassetta/__init__.py` imported from `cassetta.defaults.factory` at module scope, so the `code`
# source, which imports the file, needed the whole dependency tree present before it could answer
# what version this is. That import is gone as of 0.28.0 and the module now imports nothing. The
# first reason stands on its own: a version is read before dependencies are installed, and
# `scripts/sync-docs-version.py` and `make release-check` read the same literal the same way, so all
# three agree by construction rather than by coincidence.
[tool.hatch.version]
path = "src/cassetta/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cassetta"]

[tool.uv]
# The split reproduces the monorepo's known-good resolution verbatim; upgrading
# these is a separate task and deliberately not part of the move. Constraints
# bind resolution only — they are not dependencies and never reach wheel metadata.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "attrs==26.1.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "click==8.3.1",
    "colorama==0.4.6",
    "coverage==7.13.5",
    "cryptography==46.0.6",
    "deprecated==1.3.1",
    "fastapi==0.135.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.7.1",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "idna==3.11",
    "iniconfig==2.3.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "librt==0.8.1",
    "limits==5.8.0",
    "markdown-it-py==4.0.0",
    "mcp==1.27.0",
    "mdurl==0.1.2",
    "mypy==1.20.0",
    "mypy-extensions==1.1.0",
    "packaging==26.0",
    "pathspec==1.0.4",
    "pluggy==1.6.0",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.13.1",
    "pygments==2.20.0",
    "pyjwt==2.12.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-randomly==4.1.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "pywin32==311",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rich==15.0.0",
    "rpds-py==0.30.0",
    "ruff==0.15.9",
    "shellingham==1.5.4",
    "slowapi==0.1.9",
    "sse-starlette==3.3.4",
    "starlette==1.0.0",
    "typer==0.24.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uvicorn==0.42.0",
    "uvloop==0.22.1",
    "watchfiles==1.1.1",
    "websockets==16.0",
    "wrapt==2.1.2",
]

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["cassetta"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -m 'not slow and not network'"
markers = [
    "slow: tests over ~10s (1 GB disk-pressure probe)",
    "network: resolves dependencies from the public index (slow, and answers a different question every day; run with -m network)",
]
