[project]
name = "cassetta"
version = "0.25.0"
requires-python = ">=3.13"
license = "FSL-1.1-ALv2"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "mcp>=1.12",
    "pyjwt>=2.10",
    "slowapi>=0.1.9",
    "typer>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
cassetta = "cassetta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cassetta"]

[tool.uv]
# The split reproduces the monorepo's known-good resolution verbatim; upgrading
# these is a separate task and deliberately not part of the move. Constraints
# bind resolution only — they are not dependencies and never reach wheel metadata.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "attrs==26.1.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "click==8.3.1",
    "colorama==0.4.6",
    "coverage==7.13.5",
    "cryptography==46.0.6",
    "deprecated==1.3.1",
    "fastapi==0.135.3",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httptools==0.7.1",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "idna==3.11",
    "iniconfig==2.3.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "librt==0.8.1",
    "limits==5.8.0",
    "markdown-it-py==4.0.0",
    "mcp==1.27.0",
    "mdurl==0.1.2",
    "mypy==1.20.0",
    "mypy-extensions==1.1.0",
    "packaging==26.0",
    "pathspec==1.0.4",
    "pluggy==1.6.0",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.13.1",
    "pygments==2.20.0",
    "pyjwt==2.12.1",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "pytest-randomly==4.1.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "pywin32==311",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rich==15.0.0",
    "rpds-py==0.30.0",
    "ruff==0.15.9",
    "shellingham==1.5.4",
    "slowapi==0.1.9",
    "sse-starlette==3.3.4",
    "starlette==1.0.0",
    "typer==0.24.1",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uvicorn==0.42.0",
    "uvloop==0.22.1",
    "watchfiles==1.1.1",
    "websockets==16.0",
    "wrapt==2.1.2",
]

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["cassetta"]
mypy_path = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = [
    "slow: tests over ~10s (SC-006 1 GB disk-pressure probe)",
]
